name: Publish 8AndIn release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.0.0; got: $version" >&2
            exit 1
          fi

          tag="$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase VERSION before pushing another release commit." >&2
            exit 1
          fi

          release_notes="$RUNNER_TEMP/8andin-release-notes.md"
          {
            cat RELEASE_NOTES.md
            printf '\n\n---\n\n'
            cat INSTALLATION.md
          } > "$release_notes"

          release_archive="$RUNNER_TEMP/8AndIn-${version}.zip"
          zip -j "$release_archive" \
            8AndIn.qml README.md INSTALLATION.md RELEASE_NOTES.md VERSION LICENSE

          gh release create "$tag" \
            "$release_archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "8AndIn ${version}" \
            --notes-file "$release_notes"
